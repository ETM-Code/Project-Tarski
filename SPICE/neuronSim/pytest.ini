[pytest]
# Characterization (golden-master) suite for the spice-python neuronSim scripts.
# NOTE: do NOT set filterwarnings=error here. compute_power_stats() calls
# numpy.trapz, which emits a DeprecationWarning under numpy 2.x; treating it as
# an error would break the power-stats characterization tests for no reason.
testpaths = tests
python_files = test_*.py
addopts = -q
